<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
  <div class="container py-5 text-center bg-light">
    <!-- Header -->
    <h2 class="fw-bold display-5 mb-3">Gesturo @ [Event Name]</h2>
    <p class="fs-5 text-primary mb-4">
      <i class="bi bi-stars me-2"></i>We're going live!
    </p>

    <!-- Subheader -->
    <p class="fs-6 mb-4">
      Gesturo is hitting the stage at <strong>[Event Name]</strong> — see our gesture control tech in action, meet the
      team, and experience the future of interaction.
    </p>

    <!-- Event Info -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-4">
        <p><i class="bi bi-calendar-event me-2"></i><strong>[Event Date]</strong></p>
        <p><i class="bi bi-geo-alt me-2"></i><strong>[Location]</strong></p>
        <p><i class="bi bi-door-open me-2"></i><strong>Booth [Number]</strong></p>
      </div>
    </div>

    <!-- CTA Button -->
    <div class="mb-4">
      <a href="#" class="btn btn-primary btn-lg">
        <i class="bi bi-box-arrow-in-right me-1"></i>Register Now
      </a>
    </div>

    <!-- Event Logo -->
    <div>
      <img src="your-event-logo.png" alt="Event Logo" style="max-width: 200px;">
    </div>
  </div>



</body>

</html>
